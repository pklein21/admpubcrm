#app-screen{display:none}
.login-card{background:#222;border:1px solid #333;border-radius:16px;padding:48px 40px;width:100%;max-width:420px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}

.login-title{font-size:22px;font-weight:700;color:#fff;margin-bottom:8px}

<script>
(function(){
  var sb=window._sbClient;

  function show(id){
    document.getElementById('LS').style.display=id==='LS'?'flex':'none';
    document.getElementById('AS').style.display=id==='AS'?'block':'none';
  }

  function boot(user){
    show('AS');
    window._currentUserName=user.email.split('@')[0];
    var tnav=document.querySelector('.tnav');
    if(tnav&&!document.getElementById('UB')){
      var d=document.createElement('div');
      d.id='UB';
      d.style.cssText='display:flex;align-items:center;gap:8px;margin-left:8px;padding-left:12px;border-left:1px solid rgba(255,255,255,.2)';
      d.innerHTML='<span style="color:#aaa;font-size:12px">'+user.email+'</span>'
        +'<button onclick="window._sbClient.auth.signOut()" style="background:transparent;border:1px solid rgba(255,255,255,.2);color:#aaa;padding:4px 10px;border-radius:5px;cursor:pointer;font-size:11px">Sign Out</button>';
      tnav.appendChild(d);
    }
    if(typeof loadAll==='function')loadAll();
  }

  document.getElementById('SB').onclick=async function(){
    var em=document.getElementById('EM').value.trim();
    var pw=document.getElementById('PW').value;
    var er=document.getElementById('ER');
    er.style.display='none';
    if(!em||!pw){er.textContent='Enter email and password.';er.style.display='block';return;}
    document.getElementById('SB').textContent='Signing in...';
    var r=await sb.auth.signInWithPassword({email:em,password:pw});
    document.getElementById('SB').textContent='Sign In';
    if(r.error){er.textContent=r.error.message;er.style.display='block';}
    else{boot(r.data.user);}
  };

  sb.auth.onAuthStateChange(function(e,s){if(e==='SIGNED_OUT')show('LS');});

  sb.auth.getSession().then(function(r){
    if(r.data&&r.data.session)boot(r.data.session.user);
    else show('LS');
  });
})();
</script>
